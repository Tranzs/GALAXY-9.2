<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaxy 9.2: Shine Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Exo+2:wght@500;700;800;900&display=swap&subset=vietnamese" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="ship-screen">
      <canvas id="starfield" aria-hidden="true"></canvas>
      <div class="nebula-layer" aria-hidden="true"></div>
      <div class="fog-layer" id="fogLayer" aria-hidden="true"></div>
      <div class="warp-flash" id="warpFlash" aria-hidden="true"></div>
      <div class="scan-beam" id="scanBeam" aria-hidden="true"></div>
      <div class="blackhole-overlay" id="blackHoleOverlay" aria-hidden="true"></div>
      <div class="blackhole-video" id="blackHoleVideo" aria-hidden="true">
        <iframe
          title="Black hole background"
          src="https://www.youtube-nocookie.com/embed/mNcM7Sl0_CY?autoplay=1&mute=1&controls=0&loop=1&playlist=mNcM7Sl0_CY&modestbranding=1&playsinline=1&rel=0"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          loading="lazy"
        ></iframe>
      </div>

      <section class="cockpit" aria-label="Galaxy 9.2 cockpit">
        <div class="cockpit-top"></div>
        <div class="window-frame left"></div>
        <div class="window-frame right"></div>
        <div class="window-frame bottom-left"></div>
        <div class="window-frame bottom-right"></div>

        <header class="mission-title">
          <h1>GALAXY 9.2: SHINE JOURNEY OF GRADE 9.2</h1>
          <p>GOOD LUCK ON YOUR EXAMS! - 18 DISCOVERY DESTINATIONS</p>
        </header>

        <div class="star-map" id="starMap" aria-label="Interactive star destinations"></div>

        <aside class="mission-progress" aria-live="polite">
          <span id="unlockedCount">18</span>/18 UNLOCKED
        </aside>

        <section class="bottom-console" aria-label="Spaceship dashboard">
          <div class="side-module left-module">
            <div class="radar-ring"></div>
            <div class="tiny-lines">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="target-display">
            <div class="screen-grid"></div>
            <p>TARGETING:</p>
            <strong id="targetName">18 STAR DESTINATIONS</strong>
            <small id="targetHint">Hover a star to lock destination</small>
          </div>

          <div class="side-module right-module">
            <div class="radar-ring"></div>
            <div class="tiny-lines">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <nav class="console-actions" aria-label="Secondary console">
            <button class="console-button" data-panel="blackHole">
              <span class="button-light"></span>
              Black Hole
            </button>
            <button class="console-button" data-panel="stardust">
              <span class="button-light"></span>
              Stardust
            </button>
            <button class="console-button" data-panel="cosmicEnergy">
              <span class="button-light"></span>
              Cosmic Energy
            </button>
          </nav>
        </section>
      </section>
    </main>

    <dialog class="student-modal" id="studentModal">
      <article>
        <button class="close-button" id="closeStudent" aria-label="Close constellation profile">×</button>
        <p class="modal-kicker">DISCOVERY LOG</p>
        <h2 id="studentTitle"></h2>
        <div class="modal-grid">
          <section>
            <h3>Brightest Trait</h3>
            <p id="studentTrait"></p>
          </section>
          <section>
            <h3>Message from the Captain</h3>
            <p id="studentMessage"></p>
          </section>
          <section>
            <h3>Future Coordinates</h3>
            <p id="studentFuture"></p>
          </section>
        </div>
      </article>
    </dialog>

    <dialog class="utility-modal" id="utilityModal">
      <article>
        <button class="close-button" id="closeUtility" aria-label="Close utility panel">×</button>
        <p class="modal-kicker" id="utilityKicker">SHIP MODULE</p>
        <h2 id="utilityTitle"></h2>
        <div id="utilityBody"></div>
      </article>
    </dialog>

    <dialog class="media-viewer" id="mediaViewer">
      <button class="close-button" id="closeMedia" aria-label="Close media viewer">Ã—</button>
      <div class="media-stage" id="mediaStage"></div>
    </dialog>

    <div class="space-portal" id="spacePortal" aria-hidden="true">
      <button class="close-button" id="closeSpacePortal" aria-label="Close infinite space">Ã—</button>
      <iframe
        id="spacePortalFrame"
        title="Infinite space"
        data-src="https://www.youtube-nocookie.com/embed/ztVV54sPOns?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&loop=1&playlist=ztVV54sPOns&playsinline=1&rel=0"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
